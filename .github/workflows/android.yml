# Builds the ps3mio test APK (debug-signed, installable). Runs on every push that touches android/.
name: Android APK
on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ps3mio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ps3mio-apk
          path: ps3mio.apk
