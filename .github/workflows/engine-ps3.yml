# Engine track: PS3 PKG built from Cruslan/PS3-Movian-Next (modern PSL1GHT v2 + FFmpeg)
# with the ps3mio patch + built-in Stremio plugin. Same engine/player as the Android engine build.
# Very long (FFmpeg is compiled for the Cell CPU).
# Runs on every push that touches engine/ (or manually). The PKG files are published as a GitHub
# Release named by engine/RELEASE (for example v1.0). A release that already exists is left alone:
# edit engine/RELEASE (v1.1, ...) to publish a new one.
name: Engine - PS3 PKG
on:
  push:
    branches: [main, master]
    paths: ['engine/**', '.github/workflows/engine-ps3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ps3:
    runs-on: ubuntu-24.04  # the downloaded ppu-gcc needs glibc 2.38 or newer (22.04 has 2.35)
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build + test the Stremio plugin
        run: |
          cd engine
          node tools/build.js
          node test/mock-test.js

      - name: Host packages
        run: |
          sudo sed -i "s/azure.archive.ubuntu.com/archive.ubuntu.com/g" /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true; sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential curl tar python3 libglib2.0-bin zip unzip git xz-utils

      - name: Get PS3-Movian-Next source
        run: |
          git config --global url.https://github.com/.insteadOf git://github.com/
          git clone --recursive --depth 1 https://github.com/Cruslan/PS3-Movian-Next.git next

      - name: Apply ps3mio patch
        run: python3 engine/ps3mio_patch.py next --plugin engine/plugin --skin engine/skin

      - name: Prepare PS3 SDK (downloads ps3dev)
        working-directory: next
        run: make prepare

      - name: Create psl1ght compatibility headers
        working-directory: next
        run: |
          # The downloaded SDK has the modern flat layout (ppu-lv2.h, lv2/, sys/ ...). Some sources
          # (libntfs_ext) still include the old <psl1ght/...> paths: create small forwarding headers.
          python3 - <<'EOF'
          import os, re
          inc = 'ps3dev/ppu/include'
          shim = os.path.abspath('psl1ght-shim')
          need = set()
          rx = re.compile(rb'#\s*include\s*<(psl1ght/[^>]+)>')
          for root in ('src', 'ext'):
              for dp, dn, fn in os.walk(root):
                  if '/ffmpeg' in dp or '/libav' in dp:
                      continue
                  for f in fn:
                      if f.endswith(('.c', '.h', '.S', '.cpp')):
                          try:
                              data = open(os.path.join(dp, f), 'rb').read()
                          except OSError:
                              continue
                          for m in rx.finditer(data):
                              need.add(m.group(1).decode())
          print('psl1ght includes used by the sources:', sorted(need))
          for h in sorted(need):
              rel = h[len('psl1ght/'):]
              if rel == 'lv2.h':
                  targets = ['ppu-lv2.h', 'ppu-types.h']
              elif os.path.exists(os.path.join(inc, rel)):
                  targets = [rel]
              else:
                  targets = []
              ok = [t for t in targets if os.path.exists(os.path.join(inc, t))]
              dst = os.path.join(shim, h)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(dst, 'w') as fh:
                  fh.write('/* forwarding header generated by the ps3mio workflow */\n')
                  for t in ok:
                      fh.write('#include <%s>\n' % t)
              print('  %-34s -> %s' % (h, ok if ok else 'NOTHING FOUND (empty header)'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CPATH=%s\n' % shim)
          EOF

      - name: Disable the NTFS driver (needs the old PSL1GHT mutex API)
        working-directory: next
        run: |
          # libntfs_ext (USB NTFS drives) uses sys_mutex_* / sys_lwmutex_* functions that the official
          # PSL1GHT SDK no longer has. ps3mio streams over the network and does not need it.
          sed -i -E 's/^(CONFIG_LIBNTFS[[:space:]]*:?=[[:space:]]*)yes/\1no/' Makefile
          sed -i -E 's/^([[:space:]]*#[[:space:]]*define[[:space:]]+ENABLE_LIBNTFS)[[:space:]]+1/\1 0/' src/config.h
          echo "--- Makefile"; grep -n "CONFIG_LIBNTFS" Makefile | head
          echo "--- ntfs lines in config.h and fileaccess.c"; grep -n -i "ntfs" src/config.h src/fileaccess/fileaccess.c || true

      - name: Build
        working-directory: next
        run: make -j"$(nproc)" all APPNAMEUSER=ps3mio PKGNAME=ps3mio

      - name: Collect
        run: |
          mkdir -p out
          cp next/build/ps3mio.pkg next/build/ps3mio_geohot.pkg out/ || ls -R next/build | head -50
          cp engine/dist/stremio.zip out/

      - uses: actions/upload-artifact@v4
        with:
          name: ps3mio-engine-ps3
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$(tr -d ' \r\n' < engine/RELEASE)
          test -f out/ps3mio.pkg || { echo "ps3mio.pkg was not built"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - edit engine/RELEASE to publish a new one."
          else
            FILES="out/ps3mio.pkg"
            test -f out/ps3mio_geohot.pkg && FILES="$FILES out/ps3mio_geohot.pkg"
            gh release create "$TAG" $FILES \
              --target "$GITHUB_SHA" --prerelease --title "ps3mio $TAG (test version)" --notes-file engine/RELEASE_NOTES.md
          fi
